[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=0
MouseScrollUpAction=[!CommandMeasure MeasureScript "Page(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Page(1)"]

[Variables]
TitleText=Deadlines
SnapshotPath=#SETTINGSPATH#DeadlineWidgetV2\display.json
BackgroundColor=255,255,255,248
NeutralColor=36,42,48,255
WarningColor=214,124,0,255
CriticalColor=196,43,28,255
OverdueColor=120,120,120,255
MutedColor=88,96,104,255
LabelDays=天
LabelHours=小时
LabelMinutes=分钟
LabelOverdue=已过期
LabelEmpty=暂无截止事项
LabelError=数据不可用
LabelBridgeCommandError=命令无效
LabelBridgeMissing=管理器不可用
LabelBridgeLaunchError=启动失败
LabelTotalPrefix=共
LabelItemUnit=项
LabelPagePrefix=第
LabelPageUnit=页
LabelSeparator=·
StatusText=#LabelEmpty#
TestMode=0
TestNowEpoch=0
TestPage=1
TestResultPath=

[MeasureBridge]
Measure=Plugin
Plugin=DeadlineWidgetBridge
UpdateDivider=1

[MeasureWakeSignal]
Measure=Time
Format=%Y%m%d%H%M%S
UpdateDivider=1

[MeasureScript]
Measure=Script
ScriptFile=#@#DeadlineWidgetV2.lua
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,240,280,12 | Fill Color #BackgroundColor# | StrokeWidth 0
MouseActionCursor=0

[MeterTitle]
Meter=String
X=16
Y=12
Text=#TitleText#
FontFace=Segoe UI Semibold
FontSize=15.5
FontColor=#NeutralColor#
AntiAlias=1
DynamicVariables=1

[MeterAdd]
Meter=String
X=224
Y=10
W=24
H=28
StringAlign=Right
Text=＋
FontFace=Segoe UI
FontSize=19
FontColor=#NeutralColor#
AntiAlias=1
SolidColor=0,0,0,1

[MeterAddHitTarget]
Meter=Shape
X=196
Y=6
Shape=Rectangle 0,0,40,36 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!UpdateMeasure MeasureWakeSignal][!WriteKeyValue Variables OpenRequest "[MeasureWakeSignal]" "#SETTINGSPATH#DeadlineWidgetV2\manager-request.ini"]

